<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>New chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400&family=Inter:wght@400;500;600&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    color-scheme: light;
    --bg: #faf9f5;
    --surface: #ffffff;
    --user-bubble: #f0eee6;
    --text: #1f1e1d;
    --muted: #73726c;
    --border: #e4e1d6;
    --accent: #c6613f;
    --accent-hover: #b0553a;
    --shadow: 0 2px 14px rgba(31,30,29,.07);
    --btn-hover: #f3f1e9;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "Inter", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  .app {
    height: 100%;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  /* Conversation area */
  .thread {
    flex: 1;
    overflow-y: auto;
    padding: 32px 20px 24px;
    display: none;
  }
  .chatting .thread { display: block; }
  .thread-inner { max-width: 720px; margin: 0 auto; }

  .msg-user {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    margin-bottom: 28px;
  }
  .avatar {
    width: 32px; height: 32px; border-radius: 50%;
    background: var(--user-bubble);
    display: grid; place-items: center;
    font-size: 13px; font-weight: 600; color: var(--text);
    flex: none;
    border: 1px solid var(--border);
  }
  .bubble {
    background: var(--user-bubble);
    border-radius: 14px;
    padding: 10px 16px;
    font-size: 16px;
    line-height: 1.55;
    max-width: 100%;
    overflow-wrap: anywhere;
  }

  .msg-bot { margin-bottom: 28px; }
  /* Same typography as the article pages */
  .bot-text {
    font-family: "Public Sans", "Helvetica Neue", Arial, sans-serif;
    font-size: 19px;
    line-height: 1.7;
  }
  .bot-text p { margin: 0 0 16px; }
  .bot-text p:last-child { margin-bottom: 0; }
  .bot-text p.lead { font-weight: 600; }
  .bot-text ul { margin: 0 0 16px; padding-left: 26px; }
  .bot-text li { margin-bottom: 8px; padding-left: 4px; }
  .bot-foot { margin-top: 14px; display: flex; align-items: center; gap: 10px; }
  .spark { width: 22px; height: 22px; color: var(--accent); flex: none; }
  .thinking .spark { animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: .35; transform: scale(.9);} 50% { opacity: 1; transform: scale(1);} }

  /* Topic menu shown under the bot's replies */
  .options {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 10px;
    margin-top: 18px;
    max-width: 460px;
    font-family: "Public Sans", "Helvetica Neue", Arial, sans-serif;
  }
  .option {
    font: inherit;
    font-size: 19px;
    font-weight: 700;
    line-height: 1.4;
    text-align: left;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 18px;
    cursor: pointer;
  }
  .option:hover { background: var(--btn-hover); border-color: var(--muted); }
  .option.exit { margin-top: 10px; }
  .option:focus-visible, .send:focus-visible, .plus:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }

  /* Completion code card (shown once all four sections have been viewed) */
  .finish {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px 22px;
    margin: 8px 0 28px;
    font-size: 15.5px;
    line-height: 1.55;
  }
  .finish h2 { margin: 0 0 6px; font-size: 17px; font-weight: 600; }
  .finish p { margin: 0 0 14px; color: var(--muted); }
  .finish-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .finish input {
    flex: 1 1 260px;
    min-width: 0;
    font: 600 16px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    letter-spacing: 0.02em;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
  }
  .finish button {
    font: inherit;
    font-weight: 500;
    color: #fff;
    background: var(--accent);
    border: 0;
    border-radius: 10px;
    padding: 10px 20px;
    cursor: pointer;
  }
  .finish button:hover { background: var(--accent-hover); }
  .finish button:focus-visible, .finish input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .finish .note { margin: 10px 0 0; font-size: 13.5px; min-height: 1.4em; }

  /* Landing greeting */
  .hero {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    padding: 20px 20px 28px;
    text-align: center;
  }
  .chatting .hero { display: none; }
  .hero h1 {
    margin: 0;
    font-family: "Newsreader", Georgia, serif;
    font-weight: 400;
    font-size: clamp(30px, 5vw, 42px);
    letter-spacing: -0.01em;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .hero .spark { width: 34px; height: 34px; }

  /* Prompt box */
  .composer-wrap {
    padding: 0 16px 10px;
  }
  .landing .composer-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
  }
  .composer {
    width: 100%;
    max-width: 720px;
    margin: 0 auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 24px;
    box-shadow: var(--shadow);
    padding: 14px 14px 12px 18px;
  }
  .composer textarea {
    display: block;
    width: 100%;
    border: 0;
    outline: 0;
    resize: none;
    background: transparent;
    color: var(--text);
    font: inherit;
    font-size: 16.5px;
    line-height: 1.5;
    min-height: 28px;
    max-height: 180px;
    padding: 2px 0 6px;
  }
  .composer textarea::placeholder { color: var(--muted); }
  .composer-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 6px;
  }
  .plus {
    width: 34px; height: 34px;
    border-radius: 10px;
    border: 0;
    background: transparent;
    color: var(--muted);
    display: grid; place-items: center;
    cursor: default;
  }
  .plus:hover { background: var(--btn-hover); }
  .plus svg, .send svg { width: 20px; height: 20px; }
  .send {
    width: 34px; height: 34px;
    border-radius: 10px;
    border: 0;
    background: var(--accent);
    color: #fff;
    display: grid; place-items: center;
    cursor: pointer;
  }
  .send:hover { background: var(--accent-hover); }
  .send[disabled] { opacity: .35; cursor: default; }
  .disclaimer {
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    margin: 10px 0 4px;
  }
  .landing .disclaimer { display: none; }

  @media (max-width: 560px) {
    .thread { padding-top: 20px; }
    .bot-text { font-size: 17px; }
    .option { font-size: 17px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .thinking .spark { animation: none; }
  }
</style>
</head>
<body>
<div class="app landing" id="app">

  <section class="hero" id="hero">
    <h1>
      <svg class="spark" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 1.5c.6 5.9 4.6 9.9 10.500 10.500C16.600 12.600 12.600 16.600 12 22.500 11.400 16.600 7.400 12.600 1.500 12 7.400 11.400 11.400 7.400 12 1.500z"/></svg>
      <span>How can I help you today?</span>
    </h1>
  </section>

  <main class="thread" id="thread" aria-live="polite">
    <div class="thread-inner" id="thread-inner"></div>
  </main>

  <div class="composer-wrap" id="composer-wrap">
    <div class="composer">
      <textarea id="prompt" rows="1" aria-label="Message">tell me about magnesium supplements</textarea>
      <div class="composer-row">
        <button class="plus" type="button" aria-label="Add attachment" tabindex="-1">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <button class="send" id="send" type="button" aria-label="Send message">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </div>
    </div>
    <p class="disclaimer">AI can make mistakes. Please double-check responses.</p>
  </div>
</div>

<script>
  // ====== Content (edit here) ======
  var USER_NAME_INITIAL = "U";

  // Block types: a plain string = paragraph, {lead: "..."} = bold line, {list: [...]} = bullet list
  var STEPS = [
    {
      blocks: [
        "Magnesium is a mineral the human body needs to function properly. It's especially important for a healthy cardiovascular system, nerves, muscles, and bones. It helps regulate the body's calcium and blood sugar levels, and it's vital for the body's production of protein. And that's just the short list: more than 300 chemical reactions in the body rely, at least in part, on magnesium."
      ]
    },
    {
      label: "Benefits and dosage",
      blocks: [
        "Most of us don't need to fret over how much magnesium we're getting. The recommended daily amount of magnesium - 320 milligrams (mg) a day for women and 420 mg a day for men - isn't difficult to take in through a healthy diet.",
        "But getting extra magnesium is important for people with magnesium deficiency, and those who have complications of pregnancy known as preeclampsia and eclampsia. There are even studies suggesting that magnesium supplements might help with brain health and smoking cessation."
      ]
    },
    {
      label: "Symptoms of low magnesium",
      blocks: [
        "The symptoms of too little magnesium (hypomagnesemia) include nausea, fatigue, and reduced appetite. Of course, these symptoms can be due to many other conditions, such as a stomach bug or medication side effects.",
        "When severe, low magnesium may cause numbness in the arms and legs, muscle cramps, and an abnormal heart rhythm.",
        "Some common causes of magnesium deficiency are:",
        { list: [
          "malnutrition (or simply choosing a diet that's low in magnesium)",
          "gastrointestinal conditions (such as Crohn's disease) that cause vomiting, diarrhea, or poor absorption of magnesium",
          "kidney disease, some types of which cause excess loss of magnesium in the urine",
          "medications like diuretics or certain types of chemotherapy."
        ] }
      ]
    },
    {
      label: "Good food sources",
      blocks: [
        "Magnesium-rich foods like green, leafy vegetables (such as spinach), beans, nuts, and whole grains will help you get there. Pumpkin seeds, soy milk, bananas, and dark chocolate (in moderation!) are also good sources.",
        "Eating one serving of spinach, an ounce of almonds, and a banana provides 190 mg of magnesium. That's nearly 60% of the daily recommendation for women and 45% for men. Fortunately, magnesium is found in many healthy foods, so a good diet (such as the Mediterranean diet) will usually provide all the magnesium that you need.",
        "Unless you have a diagnosed or suspected magnesium deficiency, or a condition with clear evidence of benefit such as preeclampsia or Crohn's disease, there's no compelling reason to routinely take a magnesium supplement."
      ]
    }
  ];

  var MENU_PROMPT = "Which of the following would you like to know about magnesium supplements?";
  var EXIT_LABEL = "I don't want to know more.";

  // Streaming speed: milliseconds per word (0 = show instantly)
  var WORD_DELAY = 28;
  var THINK_DELAY = 900;

  // ====== Elements ======
  var app = document.getElementById("app");
  var thread = document.getElementById("thread");
  var inner = document.getElementById("thread-inner");
  var prompt = document.getElementById("prompt");
  var send = document.getElementById("send");
  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var SPARK = '<svg class="spark" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 1.5c.6 5.9 4.6 9.9 10.500 10.500C16.600 12.600 12.600 16.600 12 22.500 11.400 16.600 7.400 12.600 1.500 12 7.400 11.400 11.400 7.400 12 1.500z"/></svg>';

  var started = false;

  function autosize() {
    prompt.style.height = "auto";
    prompt.style.height = Math.min(prompt.scrollHeight, 180) + "px";
  }
  function refreshSend() {
    send.disabled = !started && prompt.value.trim() === "";
  }
  function scrollDown() { thread.scrollTop = thread.scrollHeight; }

  function addUserMessage(text) {
    var row = document.createElement("div");
    row.className = "msg-user";
    var av = document.createElement("div");
    av.className = "avatar";
    av.textContent = USER_NAME_INITIAL;
    var b = document.createElement("div");
    b.className = "bubble";
    b.textContent = text;
    row.appendChild(av);
    row.appendChild(b);
    inner.appendChild(row);
    scrollDown();
  }

  // Streams a string into an element word by word, then calls done().
  function streamInto(el, str, done) {
    var words = str.split(" ");
    if (WORD_DELAY === 0 || reduceMotion) {
      el.textContent = str;
      scrollDown();
      done();
      return;
    }
    var i = 0;
    (function tick() {
      i++;
      el.textContent = words.slice(0, i).join(" ");
      scrollDown();
      if (i < words.length) setTimeout(tick, WORD_DELAY);
      else setTimeout(done, 120);
    })();
  }

  // Streams a list of blocks (paragraphs, bold lines, bullet lists) into the bot text.
  function streamBlocks(container, blocks, done) {
    var bi = 0;
    function next() {
      if (bi >= blocks.length) { done(); return; }
      var block = blocks[bi++];
      if (typeof block === "string") {
        var p = document.createElement("p");
        container.appendChild(p);
        streamInto(p, block, next);
      } else if (block.lead) {
        var h = document.createElement("p");
        h.className = "lead";
        container.appendChild(h);
        streamInto(h, block.lead, next);
      } else if (block.list) {
        var ul = document.createElement("ul");
        container.appendChild(ul);
        var li = 0;
        (function nextItem() {
          if (li >= block.list.length) { next(); return; }
          var item = document.createElement("li");
          ul.appendChild(item);
          streamInto(item, block.list[li++], nextItem);
        })();
      }
    }
    next();
  }

  // Shows a bot reply. Calls done(msg) when everything has been shown.
  function botReply(blocks, done) {
    var msg = document.createElement("div");
    msg.className = "msg-bot thinking";
    var text = document.createElement("div");
    text.className = "bot-text";
    var foot = document.createElement("div");
    foot.className = "bot-foot";
    foot.innerHTML = SPARK;
    msg.appendChild(text);
    msg.appendChild(foot);
    inner.appendChild(msg);
    scrollDown();

    setTimeout(function () {
      msg.classList.remove("thinking");
      streamBlocks(text, blocks, function () { if (done) done(msg); });
    }, reduceMotion ? 0 : THINK_DELAY);
  }

  // Which sections the participant has seen so far
  var viewed = [];

  // ===== Timer: starts when the chatbot page is first opened =====
  var startTime = Date.now();
  try {
    var savedStart = parseInt(sessionStorage.getItem("cb_startTime"), 10);
    if (savedStart > 0) startTime = savedStart;               // page refreshed: keep original start
    else sessionStorage.setItem("cb_startTime", String(startTime));
  } catch (e) {}

  // ===== Log: sections viewed, in order, plus "E" if the participant ended the chat =====
  // 1 = What is magnesium?   2 = Benefits and dosage   3 = Symptoms of low magnesium   4 = Good food sources
  var log = [];

  function checksum(str) {
    var h = 2166136261;
    for (var i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619) >>> 0;
    }
    return ("0000" + h.toString(36).toUpperCase()).slice(-4);
  }

  function buildCode() {
    var secs = Math.max(0, Math.round((Date.now() - startTime) / 1000));   // total seconds since the page was opened
    var core = "CB-" + log.join(".") + "-T" + secs;
    return core + "-" + checksum(core);
  }

  function showCompletion() {
    var code = buildCode();
    var card = document.createElement("div");
    card.className = "finish";
    card.innerHTML =
      '<h2>You have reached the end</h2>' +
      '<p>Please copy the completion code below and paste it into the survey.</p>' +
      '<div class="finish-row"><input type="text" readonly aria-label="Completion code">' +
      '<button type="button">Copy code</button></div><p class="note" aria-live="polite"></p>';
    var input = card.querySelector("input");
    var btn = card.querySelector("button");
    var note = card.querySelector(".note");
    input.value = code;
    input.addEventListener("focus", function () { input.select(); });
    btn.addEventListener("click", function () {
      input.focus(); input.select();
      function ok() { note.textContent = "Copied. Now paste it into the survey."; }
      function fail() { note.textContent = "Press Ctrl+C (Cmd+C on Mac) to copy the selected code."; }
      function legacy() { try { document.execCommand("copy") ? ok() : fail(); } catch (e) { fail(); } }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(code).then(ok, legacy);
      } else { legacy(); }
    });
    inner.appendChild(card);
    scrollDown();
  }

  // Sections not viewed yet (indexes into STEPS, excluding the first reply)
  function remaining() {
    var r = [];
    for (var i = 1; i < STEPS.length; i++) if (!viewed[i]) r.push(i);
    return r;
  }

  function showStep(index) {
    viewed[index] = true;
    log.push(index + 1);
    botReply(STEPS[index].blocks, function (msg) {
      if (remaining().length) showMenu(msg);
      else showCompletion();          // everything viewed: the chat is over
    });
  }

  // Menu of the topics not seen yet, plus an option to end the chat
  function showMenu(msg) {
    var text = msg.querySelector(".bot-text");
    var q = document.createElement("p");
    text.appendChild(q);
    streamInto(q, MENU_PROMPT, function () {
      var box = document.createElement("div");
      box.className = "options";

      remaining().forEach(function (i) {
        var b = document.createElement("button");
        b.type = "button"; b.className = "option"; b.textContent = STEPS[i].label;
        b.addEventListener("click", function () {
          box.remove();
          addUserMessage(STEPS[i].label);
          showStep(i);
        });
        box.appendChild(b);
      });

      var exit = document.createElement("button");
      exit.type = "button"; exit.className = "option exit"; exit.textContent = EXIT_LABEL;
      exit.addEventListener("click", function () {
        box.remove();
        log.push("E");
        addUserMessage(EXIT_LABEL);
        showCompletion();
      });
      box.appendChild(exit);

      msg.insertBefore(box, msg.querySelector(".bot-foot"));
      scrollDown();
    });
  }

  function submit() {
    if (started) return;
    var value = prompt.value.trim();
    if (!value) return;
    started = true;

    app.classList.remove("landing");
    app.classList.add("chatting");
    addUserMessage(value);

    // lock the prompt box for the rest of the conversation
    prompt.value = "";
    prompt.placeholder = "Reply...";
    prompt.readOnly = true;
    autosize();
    send.disabled = true;

    showStep(0);
  }

  send.addEventListener("click", submit);
  prompt.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submit(); }
  });
  prompt.addEventListener("input", function () { autosize(); refreshSend(); });

  autosize();
  refreshSend();
  prompt.focus();
</script>
</body>
</html>
